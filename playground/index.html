<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cairn playground — architecture diagrams as code</title>
<style>
  :root { --bg:#1e2227; --panel:#252a31; --border:#3a4149; --text:#d6dde4; --dim:#8b97a3; --err:#ff7b72; --warn:#e3b341; --ok:#7ee787; --accent:#6cb6ff; }
  * { box-sizing:border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column; font-family:-apple-system,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; gap:12px; padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--border); flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  header .dim { color:var(--dim); font-size:12px; }
  header select, header button, header a.button { background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:5px 10px; font-size:12.5px; cursor:pointer; }
  header a.button { text-decoration:none; font:inherit; font-size:12.5px; line-height:normal; }
  header button:hover, header select:hover, header a.button:hover { border-color:var(--accent); }
  #zoom { margin-left:auto; display:flex; gap:4px; align-items:center; }
  #zoom button { width:28px; padding:5px 0; border-radius:4px; }
  #zoom-level { width:54px; font-variant-numeric:tabular-nums; }
  #zoom-fit { width:auto; padding:5px 10px; }
  main { flex:1; display:flex; min-height:0; }
  /* The split is one variable so the drag handle has a single thing to write
     to, and the stylesheet keeps the default for a browser with no stored one. */
  :root { --left-w:44%; }
  .left { width:var(--left-w); min-width:320px; display:flex; flex-direction:column; }
  /* The handle replaces the border the editor pane used to draw rather than
     sitting beside it — two lines a pixel apart read as a rendering fault. It is
     wider than the seam it paints so the pointer has something to catch. */
  #splitter { flex:none; width:9px; margin-right:-4px; cursor:col-resize;
              border-left:1px solid var(--border); background:transparent;
              transition:border-color .12s; touch-action:none; }
  #splitter:hover, #splitter.dragging { border-left-color:var(--accent); }
  /* While dragging, everything else stays out of the way: an unguarded drag
     selects the editor's text and leaves the preview showing a grab cursor. */
  body.resizing { user-select:none; }
  body.resizing #preview { cursor:col-resize; }
  #editor { flex:1; resize:none; border:0; outline:0; padding:12px 14px; background:var(--bg); color:var(--text); font:13px/1.55 ui-monospace,Menlo,Consolas,monospace; white-space:pre; tab-size:2; }
  #diags { max-height:32%; overflow:auto; border-top:1px solid var(--border); background:var(--panel); font:12px/1.5 ui-monospace,Menlo,Consolas,monospace; }
  #diags:empty { display:none; }
  .diag { padding:6px 14px; border-bottom:1px solid var(--border); cursor:pointer; }
  .diag:hover { background:var(--bg); }
  .diag b.e { color:var(--err); } .diag b.w { color:var(--warn); }
  .diag .help { color:var(--dim); display:block; }
  a.note { color:var(--dim); text-decoration:underline; }
  .right { flex:1; display:flex; flex-direction:column; min-width:0; }
  #preview { flex:1; overflow:auto; background:#ffffff; display:flex; align-items:flex-start; position:relative; cursor:grab; }
  #preview.panning { cursor:grabbing; }
  #preview.error { cursor:default; }
  /* flex:none, or a zoomed-in diagram gets shrunk back to the pane width. */
  #preview svg { max-width:none; flex:none; }
  #preview.stale svg { opacity:.45; transition:opacity .1s; }
  #preview.error { background:#fff5f5; }
  .err-panel { margin:auto; max-width:460px; padding:32px; text-align:center; }
  .err-panel .err-icon { font-size:52px; line-height:1; }
  .err-panel .err-h { margin-top:14px; font-size:19px; font-weight:700; color:#b3261e; }
  .err-panel .err-p { margin-top:8px; font-size:13.5px; line-height:1.6; color:#8a5a5a; }
  #status { padding:6px 14px; background:var(--panel); border-top:1px solid var(--border); font-size:12px; color:var(--dim); display:flex; gap:16px; align-items:center; }
  #status .ok { color:var(--ok); } #status .err { color:var(--err); }
  .note { color:var(--dim); font-size:12px; }
  /* The drag feedback is an overlay div, not a transform on the SVG: the SVG
     carries no per-element markup to move, and a dashed box is what the reader
     needs anyway — where the thing will land, not a preview of the re-layout. */
  #ghost { position:absolute; pointer-events:none; border:1.5px dashed var(--accent);
           background:rgba(108,182,255,.12); border-radius:4px; display:none; }
  /* The movable affordance. A cursor change alone is invisible until the pointer
     is already on the thing, so what can be dragged says so on hover. */
  #hover { position:absolute; pointer-events:none; border:1.5px solid var(--accent);
           background:rgba(108,182,255,.07); border-radius:4px; display:none;
           box-shadow:0 0 0 3px rgba(108,182,255,.13); }
  /* The one edit a drag cannot make to a flow label: reflow it narrower.
     Sits on the label's top-right corner, and is the only overlay that takes
     the pointer — everything else here is decoration over the drawing. */
  #wrap-icon { position:absolute; display:none; width:20px; height:20px; padding:0;
               font:13px/17px -apple-system,'Segoe UI',Roboto,sans-serif; text-align:center;
               cursor:pointer; background:var(--panel); color:var(--text);
               border:1px solid var(--accent); border-radius:4px; }
  #wrap-icon:hover { background:var(--accent); color:#10151a; }
  /* A run of a route is a line, so its overlay is one too. Both polylines live
     in one overlay <svg> laid over the drawing. */
  #routes { position:absolute; pointer-events:none; overflow:visible; display:none; }
  #routes polyline { fill:none; stroke:var(--accent); stroke-linejoin:round; stroke-linecap:round; }
  #routes .hover-route { stroke-width:5; opacity:.45; }
  #routes .ghost-route { stroke-width:2.5; stroke-dasharray:6 4; }
  /* Where a flow meets an element. A handle this small needs to read as a
     handle, so it is a filled dot rather than another line. */
  #routes .hover-dot { fill:var(--accent); fill-opacity:.3; stroke:var(--accent); stroke-width:2; }
  #routes .ghost-dot { fill:none; stroke:var(--accent); stroke-width:2.5; stroke-dasharray:4 3; }
  /* The eight grips on a hovered container. Squares, not dots: a dot on a
     border already means a flow terminal, and two handles that look alike on
     the same line is the one confusion worth spending markup to avoid. */
  #routes .grip { fill:#ffffff; stroke:var(--accent); stroke-width:1.5; }
  #routes .grip-live { fill:var(--accent); }
  #preview.draggable { cursor:move; }
  /* A run slides along its normal and nowhere else, so the cursor says which
     way before the drag starts rather than after it refuses to follow. */
  #preview.slide-x { cursor:ew-resize; }
  #preview.slide-y { cursor:ns-resize; }
  #preview.grab { cursor:grab; }
  /* A resize grip names the corner or side it pulls, the way every window
     manager does, so the direction is known before the drag starts. */
  #preview.size-n, #preview.size-s { cursor:ns-resize; }
  #preview.size-e, #preview.size-w { cursor:ew-resize; }
  #preview.size-nw, #preview.size-se { cursor:nwse-resize; }
  #preview.size-ne, #preview.size-sw { cursor:nesw-resize; }
</style>
</head>
<body>
<header>
  <h1>cairn <span class="dim">playground</span></h1>
  <select id="templates" title="Start from a template">
    <option value="">templates…</option>
    <option value="logical">logical — every kind</option>
    <option value="application">application — every kind</option>
    <option value="infrastructure">infrastructure — every kind</option>
  </select>
  <select id="theme" title="Preview theme (overrides the diagram's own theme)">
    <option value="">theme: as written</option>
  </select>
  <button id="reset-flows" title="Drop every segment-offset: and label-offset: — the flows you placed by hand go back to automatic routing against the containers as they now are">Reset flows</button>
  <button id="share">Copy share link</button>
  <button id="embed" title="A live SVG URL served by /api/svg — embed it in a README or docs">Copy embed URL</button>
  <button id="download">Download SVG</button>
  <a id="open-tab" class="button" href="view.html" target="cairn-view" title="Open the rendered diagram in a new tab — full window, browser zoom, nothing to save">Open in new tab</a>
  <select id="matrix-format" title="Flow-matrix export format — same as `cairn matrix --format`">
    <option value="csv">matrix: csv</option>
    <option value="md">matrix: md</option>
    <option value="svg">matrix: svg</option>
  </select>
  <button id="download-matrix" title="The flows of this diagram as a table — the matrice des flux techniques">Download matrix</button>
  <span class="note" id="note"></span>
  <span id="zoom">
    <button data-zoom="out" title="Zoom out (−)">−</button>
    <button data-zoom="reset" id="zoom-level" title="Reset to 100% (0)">100%</button>
    <button data-zoom="in" title="Zoom in (+)">+</button>
    <button data-zoom="fit" id="zoom-fit" title="Fit the whole diagram in the pane">fit</button>
  </span>
  <!-- The engine bundle inlines elkjs (EPL-2.0) and the Simple Icons artwork,
       so serving this page distributes them: the notices have to be reachable
       from it. build-playground.sh copies THIRD-PARTY-NOTICES.md in beside the
       bundle together with licenses/, keeping the directory layout the notice's
       own `./licenses/…` links depend on. -->
  <a class="note" id="licences" href="./THIRD-PARTY-NOTICES.md">licences</a>
</header>
<main>
  <div class="left">
    <textarea id="editor" spellcheck="false"></textarea>
    <div id="diags"></div>
  </div>
  <div id="splitter" title="Drag to resize · double-click to reset"></div>
  <div class="right">
    <div id="preview" title="Drag an element or a flow label to nudge it, slide one run of a flow across itself, or drag an end dot to another side — the DSL follows · drag the canvas to pan · ctrl/⌘ + wheel to zoom"></div>
    <div id="status"><span id="stat">loading engine…</span></div>
  </div>
</main>

<script type="module">
import { compile, version, themeNames, matrixCsv, matrixMd, matrixSvg } from './cairn-engine.js';

// Minimal starter scaffolds — one per diagram type. Each is a clean base
// that compiles with zero errors so you can build up from it.
const TEMPLATES = {
logical: `diagram logical "My logical view"

actor-group ACTORS "Actors" {
  actor USER "User"
  actor ADMIN "Administrator"
}

system SYS "My system" {
  layer FRONT "Front office" {
    block PORTAL "Portal"
    security MFA "Strong authentication"
  }
  layer BACK "Back office" {
    block CORE "Business core"
  }
}

external EXT "External systems" {
  block PARTNER "Partner service"
}

business-object BO_FILE "Case file" "the record a request opens"

USER   -> MFA     "Signs in"
MFA    -> PORTAL  "Verified identity"
PORTAL -> CORE    "Opens a case file" [BO_FILE]
ADMIN  -> CORE    "Reviews a case"
CORE   -> PARTNER "Sends for validation"

legend {
  note "Every kind this view offers is shown above"
}
`,
application: `diagram application "My application view"

actor-group ACTORS "Actors" {
  actor USER "User"
}

gateway EDGE "API gateway"
auth SSO "Auth middleware"
idp IDP "Identity provider"

system SYS "My system" {
  application APP "My application" { logo: spring
    module API "API module"
    module WORKER "Worker module"
  }
  queue EVENTS "Event bus" { logo: apachekafka }
  datastore DB "Database" { logo: postgresql }
}

external PARTNER "Partner service"

USER   -> EDGE                      # an actor flow needs no tail
EDGE   -> SSO (API_REST, JSON)
SSO    -> IDP (OIDC, JWT)
SSO    -> API (API_REST, JSON)
API    -> DB (JDBC)
API    -> EVENTS (MQ, JSON)
EVENTS -> WORKER (MQ, JSON)
WORKER -> PARTNER (SFTP, CSV)
`,
infrastructure: `diagram infrastructure "My infrastructure view"

actor USER "User"
device LAPTOP "Workstation"

site DC "Data center" {
  network-zone DMZ "DMZ" {
    firewall FW "Perimeter firewall"
    load-balancer LB "Load balancer"
    gateway RP "Reverse proxy"
  }
  network-zone LAN "Application zone" {
    auth OAUTH "OAuth2 proxy"
    idp IDP "Identity provider"
    cluster K8S "Kubernetes cluster" {
      server SRV "Worker node" {
        app-instance APP_I "Application"
      }
    }
    cluster PG "Database cluster" {
      datastore DB_PRIMARY "Primary"
      datastore DB_STANDBY "Standby"
    }
    queue BROKER "Message broker"
  }
}

external PARTNER "Partner platform"

USER   -> FW      "Web access" (HTTPS/443)
LAPTOP -> FW      "Web access" (HTTPS/443)
FW     -> LB      "Filtered traffic" (HTTPS/443)
LB     -> RP      "Balanced traffic" (HTTPS/443)
RP     -> APP_I   "API calls" (HTTPS/8443)
APP_I  -> OAUTH   "Token check" (HTTPS/8443)
OAUTH  -> IDP     "Validates tokens" (LDAPS/636)
APP_I  -> DB_PRIMARY "Queries" (TCP/5432)
DB_PRIMARY -> DB_STANDBY "Replication" (TCP/5432)
APP_I  -> BROKER  "Publishes events" (TCP/9092)
APP_I  -> PARTNER "Nightly export" (SFTP/22)
`};

const editor  = document.getElementById('editor');
const preview = document.getElementById('preview');
const diagsEl = document.getElementById('diags');
const stat    = document.getElementById('stat');
const note    = document.getElementById('note');
const themeSel = document.getElementById('theme');
const zoomLevel = document.getElementById('zoom-level');
let lastSvg = null, lastMatrix = null, lastBoxes = null, zoom = 1, currentTheme = '';
// The bus to the `view.html` tabs, and the last thing published on it. Declared
// here rather than beside its click handler further down because the render
// loop below publishes to it — a `const` reached forward into is a trap the
// first person to move the initial `run()` call would spring.
const viewChannel = new BroadcastChannel('cairn-view');
let viewState = null;

// Populate the theme dropdown from the engine's theme list.
for (const t of themeNames) {
  const o = document.createElement('option');
  o.value = t; o.textContent = 'theme: ' + t;
  themeSel.appendChild(o);
}
themeSel.addEventListener('change', e => { currentTheme = e.target.value; run(); });

const escapeHtml = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const b64encode = s => btoa(String.fromCharCode(...new TextEncoder().encode(s)));
const b64decode = s => new TextDecoder().decode(Uint8Array.from(atob(s), c => c.charCodeAt(0)));

// --- Live render loop -------------------------------------------------------
// Serialised (never overlap the ELK worker) + latest-wins: while a compile is
// in flight, edits set `pending`; when it finishes we re-run against the newest
// text. When the DSL has errors we do NOT render the diagram — the preview
// switches to a clear error state and points at the error list below.
let running = false, pending = false;

// A diagram that arrived whole — pasted, templated, or carried by a shared
// link — is one nobody has framed yet. Ordinary edits keep the reader's framing.
let fitOnNextRender = true;

function schedule() {
  preview.classList.add('stale');
  viewChannel.postMessage({ type: 'stale' });
  clearTimeout(schedule._t);
  schedule._t = setTimeout(run, 120);
}

async function run() {
  if (running) { pending = true; return; }
  running = true;
  const src = editor.value;
  try {
    // `matrix: true` costs a pass over the flows — no layout — so the export
    // is ready the moment the button is clicked, without recompiling.
    const r = await compile(src, { theme: currentTheme || undefined, matrix: true });
    lastMatrix = r.matrix;
    lastBoxes = r.boxes;
    diagsEl.innerHTML = r.diagnostics.map(d =>
      `<div class="diag" data-line="${d.span.line}"><b class="${d.severity === 'error' ? 'e' : 'w'}">${d.severity}[${d.code}]</b> line ${d.span.line}: ${escapeHtml(d.message)}${d.help ? `<span class="help">help: ${escapeHtml(d.help)}</span>` : ''}</div>`
    ).join('');
    const ne = r.diagnostics.filter(d => d.severity === 'error').length;
    const nw = r.diagnostics.length - ne;
    if (r.svg) {
      lastSvg = r.svg;
      preview.classList.remove('error');
      // Replacing the SVG resets the pane's scroll — restore it once resized.
      const { scrollLeft, scrollTop } = preview;
      preview.innerHTML = r.svg;
      addOverlays();   // innerHTML above dropped them
      // match the preview backdrop to the theme's canvas colour
      const bg = (r.svg.match(/<rect width="\d+" height="\d+" fill="([^"]+)"\/>/) || [])[1];
      if (bg) preview.style.background = bg;
      publishView({ type: 'svg', svg: r.svg, bg, status: stat.innerHTML,
        title: (src.match(/^\s*diagram\s+\w+\s+"([^"]*)"/m) || [])[1] });
      applyZoom();
      // Cleared only here, so a paste that does not compile is fitted once fixed.
      if (fitOnNextRender) {
        fitOnNextRender = false;
        fitToPane();
      } else {
        preview.scrollTo(scrollLeft, scrollTop);
      }
      stat.innerHTML = `<span class="ok">✓</span> ${r.metrics.width}×${r.metrics.height} · layout ${r.metrics.layoutMs} ms${nw ? ` · <span style="color:var(--warn)">${nw} warning${nw > 1 ? 's' : ''}</span>` : ''} · engine v${version}`;
    } else {
      // errors: do NOT render the diagram at all — clear it and show a clear
      // error state so it's unmistakable, pointing to the error list below.
      preview.classList.add('error');
      lastBoxes = null;
      preview.innerHTML = `<div class="err-panel"><div class="err-icon">⚠</div>`
        + `<div class="err-h">${ne} error${ne > 1 ? 's' : ''} — diagram not rendered</div>`
        + `<div class="err-p">Fix the ${ne > 1 ? 'errors' : 'error'} listed below the editor and the diagram will render again automatically.</div></div>`;
      stat.innerHTML = `<span class="err">✗ ${ne} error${ne > 1 ? 's' : ''}</span> — fix them to render`;
      publishView({ type: 'error', heading: `${ne} error${ne > 1 ? 's' : ''} — diagram not rendered`, status: stat.innerHTML });
    }
  } catch (e) {
    preview.classList.add('error');
    lastBoxes = null;
    preview.innerHTML = `<div class="err-panel"><div class="err-icon">⚠</div>`
      + `<div class="err-h">Engine error — diagram not rendered</div>`
      + `<div class="err-p">${escapeHtml(e.message)}</div></div>`;
    stat.innerHTML = `<span class="err">engine error: ${escapeHtml(e.message)}</span>`;
    publishView({ type: 'error', heading: 'Engine error — diagram not rendered', status: stat.innerHTML });
  } finally {
    running = false;
    preview.classList.remove('stale');
    if (pending) { pending = false; run(); }   // re-render against the newest text
  }
}

editor.addEventListener('input', schedule);

// `paste` fires before the value changes, so the selection is still the range
// about to be overwritten: covering all of it means the paste is the diagram.
editor.addEventListener('paste', () => {
  const replacesWholeSource =
    editor.selectionStart === 0 && editor.selectionEnd === editor.value.length;
  if (replacesWholeSource) fitOnNextRender = true;
});

diagsEl.addEventListener('click', e => {
  const line = e.target.closest('.diag')?.dataset.line;
  if (!line) return;
  const pos = editor.value.split('\n').slice(0, line - 1).join('\n').length + 1;
  editor.focus(); editor.setSelectionRange(pos, pos);
});

// --- Templates --------------------------------------------------------------
document.getElementById('templates').addEventListener('change', e => {
  const t = TEMPLATES[e.target.value];
  if (t) { editor.value = t; fitOnNextRender = true; run(); }
  e.target.value = '';
});

// --- Share / embed / download ----------------------------------------------
function flash(msg) { note.textContent = msg; clearTimeout(flash._t); flash._t = setTimeout(() => note.textContent = '', 2200); }

document.getElementById('reset-flows').addEventListener('click', () => {
  const cleared = stripFlowHints(editor.value);
  if (cleared === editor.value) return flash('no flow hints to clear');
  editor.value = cleared;
  flash('flow hints cleared — the router picks the routes again ✓');
  run();
});

document.getElementById('share').addEventListener('click', async () => {
  location.hash = 'src=' + b64encode(editor.value);
  await navigator.clipboard.writeText(location.href);
  flash('share link copied ✓');
});

document.getElementById('embed').addEventListener('click', async () => {
  const url = `${location.origin}/api/svg?s=${encodeURIComponent(b64encode(editor.value))}`;
  await navigator.clipboard.writeText(url);
  flash('embed URL copied ✓  (served by /api/svg)');
});

// Hand the blob to the browser as a download, then release the object URL —
// it stays allocated until the page unloads otherwise. Revoking on the next
// tick rather than straight after click(), which can cancel the download.
function download(content, mime, filename) {
  const url = URL.createObjectURL(new Blob([content], { type: mime }));
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 0);
}

document.getElementById('download').addEventListener('click', () => {
  if (!lastSvg) return;
  download(lastSvg, 'image/svg+xml', 'diagram.svg');
});

// `view.html` in a tab of its own, following this one's edits.
//
// A snapshot would have been a `blob:` URL of `lastSvg` and two lines long, but
// a blob is frozen bytes: nothing can push a new render into one. So the tab
// gets a real page instead, and every render outcome is broadcast to it — the
// view mirrors this preview rather than copying it once.
//
// A real link, not `window.open`. A script-opened window is a pop-up as far as
// the blocker is concerned, and origins that are not `localhost` are routinely
// blocked by default; following an anchor the reader actually clicked is a
// navigation, which no blocker intercepts. The `target` still names the window,
// so clicking again refocuses the tab that is already watching instead of
// spawning another. `rel="noopener"` is deliberately absent: it forces a fresh
// context every time and would defeat that reuse.
document.getElementById('open-tab').addEventListener('click', () => {
  flash('opened — the view follows your edits');
});

// A view tab announces itself on load, and on every reload. It cannot ask the
// engine for a render, so whatever this tab last produced is replayed to it.
viewChannel.onmessage = ({ data }) => {
  if (data.type === 'hello') publishView();
};

// The one place that knows what the view should currently show. Called after
// each render outcome, and again whenever a fresh view tab says hello.
function publishView(next) {
  if (next) viewState = next;
  if (viewState) viewChannel.postMessage(viewState);
}

// A closing playground leaves its views saying so, rather than showing a
// drawing that has silently stopped following anything.
addEventListener('pagehide', () => viewChannel.postMessage({ type: 'bye' }));

const MATRIX_FORMATS = {
  csv: { mime: 'text/csv',         format: matrixCsv },
  md:  { mime: 'text/markdown',    format: matrixMd  },
  svg: { mime: 'image/svg+xml',    format: matrixSvg },
};

document.getElementById('download-matrix').addEventListener('click', () => {
  if (!lastMatrix || !lastMatrix.rows.length) { flash('no flows to tabulate'); return; }
  const ext = document.getElementById('matrix-format').value;
  const { mime, format } = MATRIX_FORMATS[ext];
  // Same name the CLI writes: `cairn matrix <file>` → `<file>.flow.<ext>`.
  download(format(lastMatrix), mime, 'diagram.flow.' + ext);
});

// --- Zoom and pan -----------------------------------------------------------
// A ladder of exact stops, not a multiplier: `zoom *= 1.333` then `*= 0.75`
// lands on 0.99975, never back on 100%. The floor is low because
// examples/large-fr.cairn is 3995px wide and needs ~20% to fit a half window.
const ZOOM_STOPS = [0.1, 0.15, 0.25, 0.5, 0.75, 1, 1.25, 1.5, 2, 3, 4];
const ZOOM_MIN = ZOOM_STOPS[0];
const ZOOM_MAX = ZOOM_STOPS[ZOOM_STOPS.length - 1];
// One wheel notch (~100px) is about a 16% change.
const WHEEL_ZOOM_SENSITIVITY = 0.0015;
const FIT_PADDING_PX = 24;
// Fit and wheel zoom land between stops, so "beyond current" needs slack.
const ZOOM_EPSILON = 1e-4;

const clampZoom = z => Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z));

function nextZoomStop(direction) {
  const stops = direction > 0 ? ZOOM_STOPS : ZOOM_STOPS.slice().reverse();
  const isBeyondCurrent = stop => direction * (stop - zoom) > ZOOM_EPSILON;
  return stops.find(isBeyondCurrent) ?? zoom;
}

/** Shrinks only: this runs unattended on load, where blowing a starter
    template up to 400% would startle rather than help. */
function paneFitZoom() {
  const box = svgViewBox();
  if (!box) return zoom;
  const width = preview.clientWidth - FIT_PADDING_PX;
  const height = preview.clientHeight - FIT_PADDING_PX;
  return clampZoom(Math.min(width / box.width, height / box.height, 1));
}

function fitToPane() {
  setZoom(paneFitZoom());
  preview.scrollTo(0, 0);
}

function svgViewBox() {
  const svg = preview.querySelector('svg');
  return svg?.viewBox?.baseVal?.width ? svg.viewBox.baseVal : null;
}

/** Zooms with the point under `anchor` (a mouse event, else the pane centre)
    pinned to the same pixel, so the diagram does not slide out from under it. */
function setZoom(next, anchor) {
  const previous = zoom;
  zoom = clampZoom(next);
  if (zoom === previous) return;
  const pane = preview.getBoundingClientRect();
  const anchorX = anchor ? anchor.clientX - pane.left : preview.clientWidth / 2;
  const anchorY = anchor ? anchor.clientY - pane.top : preview.clientHeight / 2;
  const scrollLeft = preview.scrollLeft, scrollTop = preview.scrollTop;
  const ratio = zoom / previous;
  applyZoom();
  // Valid only while the SVG sits flush with the pane's top-left corner: any
  // centring in #preview's flex rules puts an offset between them.
  preview.scrollLeft = (scrollLeft + anchorX) * ratio - anchorX;
  preview.scrollTop = (scrollTop + anchorY) * ratio - anchorY;
}

function applyZoom() {
  zoomLevel.textContent = Math.round(zoom * 100) + '%';
  const box = svgViewBox();
  if (!box) return;
  const svg = preview.querySelector('svg');
  svg.style.width = (box.width * zoom) + 'px';
  svg.style.height = (box.height * zoom) + 'px';
}

const ZOOM_ACTIONS = {
  in:    () => setZoom(nextZoomStop(1)),
  out:   () => setZoom(nextZoomStop(-1)),
  reset: () => setZoom(1),
  fit:   fitToPane,
};

document.getElementById('zoom').addEventListener('click', e => {
  ZOOM_ACTIONS[e.target.dataset.zoom]?.();
});

// A trackpad pinch reaches the page as a ctrl+wheel event, so this covers both.
preview.addEventListener('wheel', e => {
  if (!e.ctrlKey && !e.metaKey) return;
  e.preventDefault();
  setZoom(zoom * Math.exp(-e.deltaY * WHEEL_ZOOM_SENSITIVITY), e);
}, { passive: false });

// --- Drag to nudge ----------------------------------------------------------
// A drag does not move the drawing: it writes an `offset:` into the DSL and lets
// the engine render it. The source stays the single description of the diagram,
// which is the whole point of diagram-as-code — a playground that moved pixels
// would produce a picture nobody could reproduce from the file.
//
// Hit-testing reads `compile()`'s `boxes`, not the SVG: the drawing carries no
// per-element markup, deliberately, so its bytes are identical whether or not
// anything ever dragged it.
const ghost = document.createElement('div');
ghost.id = 'ghost';
const hover = document.createElement('div');
hover.id = 'hover';
// A flow is a line, so a box overlay says nothing useful about it: the
// rectangle around a route that turns three corners covers half the drawing.
// Both route overlays are polylines in one <svg> laid over the drawing.
const SVG_NS = 'http://www.w3.org/2000/svg';
const routes = document.createElementNS(SVG_NS, 'svg');
routes.id = 'routes';
const overlayShape = (tag, className, attributes = {}) => {
  const shape = document.createElementNS(SVG_NS, tag);
  shape.setAttribute('class', className);
  for (const [name, value] of Object.entries(attributes)) shape.setAttribute(name, value);
  shape.style.display = 'none';
  routes.append(shape);
  return shape;
};
// Wrapping a flow label is the one thing no drag can express, so it gets a
// button — on the label the pointer is over, since that is what it acts on.
const wrapIcon = document.createElement('button');
wrapIcon.id = 'wrap-icon';
wrapIcon.type = 'button';
wrapIcon.textContent = '\u21b5';
wrapIcon.title = 'Wrap this flow label, at half its width';
/** One overlay in each shape per role, so a box, a run and a terminal all light
    up the same way: a rectangle, a line, a dot. */
const HOVER = {
  box: hover,
  route: overlayShape('polyline', 'hover-route'),
  dot: overlayShape('circle', 'hover-dot', { r: 6 }),
};
const GHOST = {
  box: ghost,
  route: overlayShape('polyline', 'ghost-route'),
  dot: overlayShape('circle', 'ghost-dot', { r: 7 }),
};
/** Every overlay lives in the preview, which `run()` empties on every render. */
const addOverlays = () => preview.append(hover, ghost, routes, wrapIcon);
addOverlays();

// Below this, a drag is a click that wobbled — panning, or nothing at all.
const DRAG_THRESHOLD_PX = 3;

/** Pointer position in diagram coordinates, or null when nothing is rendered. */
function diagramPoint(e) {
  const svg = preview.querySelector('svg');
  if (!svg) return null;
  const rect = svg.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / zoom, y: (e.clientY - rect.top) / zoom };
}

/** Half the width of the band a run can be grabbed by, in screen pixels — the
    overlay that draws it is sized in screen pixels too, so the band has to
    shrink with the drawing, not with the zoom. */
const SEGMENT_GRAB_PX = 5;

// --- Resize grips ------------------------------------------------------------
// A container is the one thing in the drawing with a size of its own to argue
// about: a leaf box is whatever its label needs, but a container is only ever
// "big enough for what is in it", and an author often wants more room than that.
// So a hovered container puts eight grips on its border, and a drag on one
// writes a `size:` — the same contract as `offset:`, a delta on what the layout
// computed rather than an absolute box that would go stale the moment a child
// is added.
//
// The floor comes from the engine (`box.resize`), never from a rule re-derived
// here: the pass that applies the hint floors it at exactly that number, so a
// grip stopped there promises the box that will actually be drawn. There is no
// ceiling — a container dragged past its parent makes the parent grow with it.

// The grip geometry below is lifted out between these markers by
// `tests/playground.test.ts`, the same way the writeback is: a clamp that
// disagreed with the engine would promise a box it then refuses to draw.
// #region resize-geometry
/** The eight grips, as the unit position of each along the box. */
const GRIP_AT = {
  nw: { x: 0, y: 0 }, n: { x: 0.5, y: 0 }, ne: { x: 1, y: 0 },
  w:  { x: 0, y: 0.5 },                    e:  { x: 1, y: 0.5 },
  sw: { x: 0, y: 1 }, s: { x: 0.5, y: 1 }, se: { x: 1, y: 1 },
};
const GRIP_NAMES = Object.keys(GRIP_AT);

/** How close the pointer has to be to a grip to take hold of it, in screen
    pixels — wider than the run band, since a grip sits on a border a run may
    also be near. */
const GRIP_GRAB_PX = 7;

/** Where one grip sits on `box`, in diagram coordinates. */
const gripPoint = (box, grip) => ({
  x: box.x + GRIP_AT[grip].x * box.width,
  y: box.y + GRIP_AT[grip].y * box.height,
});

/**
 * The box a drag on `grip` would leave, already held inside the engine's own
 * bounds — so the ghost and the drawing cannot disagree.
 *
 * A grip on the north or west face moves the corner as well as the size, which
 * is why a drag there writes two hints: `offset:` for the corner, `size:` for
 * the rest. The east and south faces leave the corner alone and write one.
 */
function resized(box, grip, dx, dy) {
  const pull = GRIP_AT[grip];
  const wide = pull.x !== 0.5, tall = pull.y !== 0.5;
  const { minWidth, minHeight } = box.resize;
  // A west pull grows the box as the pointer goes left, so the delta is negated;
  // an east pull takes it as it comes. Same on the other axis. Only the floor
  // stops it: growing past the parent is allowed, and the parent follows.
  const width = wide ? Math.max(box.width + (pull.x ? dx : -dx), minWidth) : box.width;
  const height = tall ? Math.max(box.height + (pull.y ? dy : -dy), minHeight) : box.height;
  // The face the grip is on is the one that moves; the opposite one is the
  // anchor, so a west pull turns the width it won into a leftward shift.
  return {
    what: 'element',
    x: box.x - (wide && !pull.x ? width - box.width : 0),
    y: box.y - (tall && !pull.y ? height - box.height : 0),
    width,
    height,
  };
}
// #endregion resize-geometry

/** Only a container the engine gave bounds for can be resized — which is every
    container, and nothing else. */
const resizable = box => box?.what === 'element' && box.container && !!box.resize;

/** One overlay square per grip, drawn in screen pixels like the terminal dot,
    so a grip is the same size to aim at whatever the drawing is scaled to. */
const GRIP_SIZE_PX = 9;
const GRIPS = GRIP_NAMES.map(() => overlayShape('rect', 'grip', { rx: 2 }));

const hideGrips = () => { for (const shape of GRIPS) shape.style.display = 'none'; };

/** Draws the grips of `box`, with `live` — the one being dragged or hovered —
    filled in. */
function placeGrips(box, live = null) {
  if (!resizable(box) || !parkRoutes()) return hideGrips();
  GRIP_NAMES.forEach((grip, index) => {
    const shape = GRIPS[index];
    const at = gripPoint(box, grip);
    shape.style.display = 'block';
    shape.setAttribute('class', grip === live ? 'grip grip-live' : 'grip');
    shape.setAttribute('width', GRIP_SIZE_PX);
    shape.setAttribute('height', GRIP_SIZE_PX);
    shape.setAttribute('x', at.x * zoom - GRIP_SIZE_PX / 2);
    shape.setAttribute('y', at.y * zoom - GRIP_SIZE_PX / 2);
  });
}

/** Containers, innermost first — the order both the grip search and the hover
    highlight want, so an inner layer wins over the system around it. */
const containersByArea = () =>
  (lastBoxes ?? []).filter(resizable).sort((a, b) => a.width * a.height - b.width * b.height);

/** The innermost container the pointer is inside, or null. */
function containerUnder(point) {
  if (!point) return null;
  return containersByArea().find(box =>
    point.x >= box.x && point.x <= box.x + box.width &&
    point.y >= box.y && point.y <= box.y + box.height) ?? null;
}

/** The grip nearest the pointer on `box`, within the grab radius. */
function gripAt(box, point) {
  if (!resizable(box) || !point) return null;
  let best = null;
  for (const grip of GRIP_NAMES) {
    const at = gripPoint(box, grip);
    const distance = Math.hypot(point.x - at.x, point.y - at.y);
    if (distance <= GRIP_GRAB_PX / zoom && (!best || distance < best.distance)) best = { grip, distance };
  }
  return best?.grip ?? null;
}

/** A run is vertical when its two endpoints share an x. */
const isVertical = box => Math.abs(box.points[0].x - box.points[1].x) < 0.5;

/** How close the pointer has to be to a terminal to take hold of it, in screen
    pixels. Wider than the run band it sits on, since it wins the tie. */
const TERMINAL_GRAB_PX = 8;

/** The flow terminal nearest the pointer, within the grab radius. */
function terminalAt(point) {
  let best = null;
  for (const box of lastBoxes) {
    if (box.what !== 'terminal') continue;
    const distance = Math.hypot(point.x - box.x, point.y - box.y);
    if (distance <= TERMINAL_GRAB_PX / zoom && (!best || distance < best.distance)) best = { box, distance };
  }
  return best?.box ?? null;
}

/**
 * The side of its element a terminal would attach to if it were dropped at
 * `point`, and the middle of that side — which is where the ghost sits, because
 * `ID.side` names a side and not a seat on it.
 *
 * Measured from the box centre in *normalised* units, so a wide element does not
 * read as left or right from almost everywhere.
 */
function terminalTarget(box, point) {
  const element = lastBoxes?.find(b => b.what === 'element' && b.id === box.endpoint.element);
  if (!element || !point) return null;
  const half = { x: element.width / 2 || 1, y: element.height / 2 || 1 };
  const from = { x: point.x - (element.x + half.x), y: point.y - (element.y + half.y) };
  const side = Math.abs(from.x / half.x) >= Math.abs(from.y / half.y)
    ? (from.x >= 0 ? 'right' : 'left')
    : (from.y >= 0 ? 'bottom' : 'top');
  const middle = {
    left:   { x: element.x, y: element.y + half.y },
    right:  { x: element.x + element.width, y: element.y + half.y },
    top:    { x: element.x + half.x, y: element.y },
    bottom: { x: element.x + half.x, y: element.y + element.height },
  }[side];
  return { side, ...middle };
}

/** Distance from `point` to the segment `a`–`b`. */
function distanceToSegment(point, a, b) {
  const vx = b.x - a.x, vy = b.y - a.y;
  const lengthSq = vx * vx + vy * vy;
  const along = lengthSq
    ? Math.max(0, Math.min(1, ((point.x - a.x) * vx + (point.y - a.y) * vy) / lengthSq))
    : 0;
  return Math.hypot(point.x - (a.x + along * vx), point.y - (a.y + along * vy));
}

/** The run passing closest under the pointer, within the grab band. */
function segmentAt(point) {
  let best = null;
  for (const box of lastBoxes) {
    if (box.what !== 'segment') continue;
    const distance = distanceToSegment(point, box.points[0], box.points[1]);
    if (distance <= SEGMENT_GRAB_PX / zoom && (!best || distance < best.distance)) best = { box, distance };
  }
  return best?.box ?? null;
}

/**
 * What the pointer has hold of: a flow terminal, else a flow label, else one run
 * of a route, else the smallest element box under it — so a child wins over its
 * container.
 *
 * Most specific first. A terminal sits at the end of its own run and on the
 * border of its element, so anything but first place makes it unreachable.
 * Labels outrank runs because a label sits *on* its own run, and a run that won
 * there would leave `label-offset:` unreachable. Runs outrank elements because
 * the grab band is 5px wide: a pointer that close to a line is on the line,
 * whatever box the line happens to cross.
 */
function boxAt(point) {
  if (!lastBoxes || !point) return null;
  const inside = lastBoxes
    .filter(b => b.what !== 'segment' && b.what !== 'terminal' &&
                 point.x >= b.x && point.x <= b.x + b.width &&
                 point.y >= b.y && point.y <= b.y + b.height)
    .sort((a, b) => a.width * a.height - b.width * b.height);
  return terminalAt(point) ??
    inside.find(b => b.what === 'label') ?? segmentAt(point) ?? inside[0] ?? null;
}

/**
 * What the pointer has hold of, and on which resize grip if any.
 *
 * A grip ranks below a terminal and above everything else: a terminal and a grip
 * can land on the same point — both live on a container's border — and a flow
 * that could not be re-attached is the worse loss, since a grip has seven
 * others. Below that, a grip beats the box it belongs to, or the border would be
 * a place you can only move the container from.
 */
function grabAt(point) {
  const terminal = terminalAt(point);
  if (terminal) return { box: terminal, grip: null };
  for (const box of containersByArea()) {
    const grip = gripAt(box, point);
    if (grip) return { box, grip };
  }
  const box = boxAt(point);
  return box ? { box, grip: null } : null;
}

/**
 * Lays one overlay over a box in diagram coordinates, shifted by `dx, dy`.
 *
 * The overlays are absolutely positioned inside `#preview`, so their offsets are
 * measured from its padding box and scroll with its content. Where the drawing
 * starts inside that box is read from the two rectangles rather than from
 * `svg.offsetLeft`: `offsetLeft` is an `HTMLElement` property and `<svg>` is an
 * `SVGElement`, so it reads `undefined` there and every coordinate built on it
 * comes out `NaN` — which the browser drops, parking the overlay in the corner.
 */
function overlayOrigin() {
  const svg = preview.querySelector('svg');
  if (!svg) return null;
  const svgRect = svg.getBoundingClientRect();
  const paneRect = preview.getBoundingClientRect();
  return {
    x: svgRect.left - paneRect.left + preview.scrollLeft,
    y: svgRect.top - paneRect.top + preview.scrollTop,
    width: svgRect.width,
    height: svgRect.height,
  };
}

function placeOverlay(el, box, dx = 0, dy = 0) {
  const origin = overlayOrigin();
  if (!origin) return;
  el.style.display = 'block';
  el.style.left   = (origin.x + (box.x + dx) * zoom) + 'px';
  el.style.top    = (origin.y + (box.y + dy) * zoom) + 'px';
  el.style.width  = (box.width * zoom) + 'px';
  el.style.height = (box.height * zoom) + 'px';
}

/**
 * Draws one flow's route into `line`, shifted by `dx, dy`.
 *
 * The overlay <svg> is parked over the drawing on every call rather than once:
 * a zoom, a pan or a re-render moves the drawing under it, and there is no
 * cheaper moment to notice than the one that is about to draw on it.
 */
function parkRoutes() {
  const origin = overlayOrigin();
  if (!origin) return false;
  routes.style.display = 'block';
  routes.style.left   = origin.x + 'px';
  routes.style.top    = origin.y + 'px';
  routes.style.width  = origin.width + 'px';
  routes.style.height = origin.height + 'px';
  return true;
}

function placeRoute(line, box, dx = 0, dy = 0) {
  if (!parkRoutes()) return;
  line.style.display = 'block';
  line.setAttribute(
    'points',
    box.points.map(p => `${(p.x + dx) * zoom},${(p.y + dy) * zoom}`).join(' '),
  );
}

/** Marks one point in diagram coordinates. The radius stays in screen pixels,
    so a handle is the same size to grab at every zoom. */
function placeDot(dot, x, y) {
  if (!parkRoutes()) return;
  dot.style.display = 'block';
  dot.setAttribute('cx', x * zoom);
  dot.setAttribute('cy', y * zoom);
}

const hideOverlay = pair => {
  pair.box.style.display = 'none';
  pair.route.style.display = 'none';
  pair.dot.style.display = 'none';
  if (pair === HOVER) wrapIcon.style.display = 'none';
};

/** Side of the square button, in screen pixels — it is aimed at with a pointer,
    so it keeps its size whatever the drawing is scaled to. */
const WRAP_ICON_PX = 20;

/** Parks the wrap button on the top-right corner of a hovered flow label, and
    remembers the line it would rewrite. Anything else hovered hides it. */
function placeWrapIcon(box) {
  wrapIcon.style.display = 'none';
  const origin = box.what === 'label' ? overlayOrigin() : null;
  if (!origin) return;
  wrapIcon.line = box.line;
  wrapIcon.style.display = 'block';
  wrapIcon.style.left = (origin.x + (box.x + box.width) * zoom - WRAP_ICON_PX / 2) + 'px';
  wrapIcon.style.top  = (origin.y + box.y * zoom - WRAP_ICON_PX / 2) + 'px';
}

/** Lights up what the pointer holds, in the shape that fits it. */
function showOverlay(pair, box, dx = 0, dy = 0) {
  hideOverlay(pair);
  if (box.what === 'terminal') placeDot(pair.dot, box.x + dx, box.y + dy);
  else if (box.what === 'segment') placeRoute(pair.route, box, dx, dy);
  else placeOverlay(pair.box, box, dx, dy);
  if (pair === HOVER) placeWrapIcon(box);
}

// The writeback below is pure text surgery on the DSL, and `tests/playground.test.ts`
// lifts it out between these markers to round-trip it through the real parser.
// Keep the three functions contiguous, and the markers where they are.
// #region drag-writeback
/**
 * Index of the body brace on a declaration line, or -1.
 *
 * Quoted text is blanked out first: `"step {1}"` is a legal flow label and
 * `"IHM SIET\nPCC"` a legal element one, and a brace inside either is part of
 * the text, not the start of a block.
 */
const maskQuoted = line =>
  line.replace(/"(?:[^"\\]|\\.)*"/g, quoted => ' '.repeat(quoted.length));

function braceIndex(line) {
  return maskQuoted(line).indexOf('{');
}

/**
 * Puts `statement` inside the brace block on `line`, opening one if there is
 * none, and returns the rewritten line.
 *
 * Three shapes exist and all three have to survive a round trip through the
 * parser: no body at all, a body opened and closed on the one line
 * (`application X "Y" {logo: angular }`), and a body left open for the lines
 * below. Appending a second `{ … }` after the first is not a body, it is a
 * syntax error — which is what a drag on a one-line body used to write.
 *
 * Spacing is explicit because the statement is a token sequence, not text:
 * `47logo` happens to lex as `47` then `logo`, and code that relies on that is
 * one lexer change from writing corrupt source.
 */
function insertInBlock(line, statement) {
  const masked = maskQuoted(line);
  const open = masked.indexOf('{');
  if (open < 0) return `${line} { ${statement} }`;
  const close = masked.indexOf('}', open + 1);
  if (close < 0) {
    const head = line.slice(0, open + 1);
    const tail = line.slice(open + 1);
    return `${head} ${statement}${tail.startsWith(' ') ? '' : ' '}${tail}`;
  }
  const head = line.slice(0, close);
  const spacer = head.endsWith(' ') || head.endsWith('{') ? '' : ' ';
  return `${head}${spacer}${statement} ${line.slice(close)}`;
}

/** Splices `text` over a parser span (1-based line, 1-based col, length). */
function spliceSpan(source, span, text) {
  const lines = source.split('\n');
  const line = lines[span.line - 1];
  lines[span.line - 1] = line.slice(0, span.col - 1) + text + line.slice(span.col - 1 + span.len);
  return lines.join('\n');
}

/**
 * Moves one end of a flow to another side of its element, by writing the
 * `ID.side` the DSL already has for it — no new grammar, and a file a drag
 * produced is one an author could have typed.
 *
 * Two shapes, one splice. An endpoint that already declares a side has just the
 * side word replaced; one that does not has its id replaced by `ID.side`. Which
 * of the two `endpoint.span` covers is settled by whether a side is declared,
 * so there is nothing here to get wrong when both ends of a flow are moved.
 */
function writeSide(source, box, side) {
  const { span, element, side: declared } = box.endpoint;
  return spliceSpan(source, span, declared ? side : `${element}.${side}`);
}

/** The `dx, dy` a span currently holds, so a second drag adds to the first
    instead of replacing it. */
function readSpan(source, span) {
  const line = source.split('\n')[span.line - 1] ?? '';
  const [dx, dy] = line.slice(span.col - 1, span.col - 1 + span.len).split(',').map(Number);
  return Number.isFinite(dx) && Number.isFinite(dy) ? { dx, dy } : { dx: 0, dy: 0 };
}

/**
 * Writes the nudge into the source and returns the new text.
 *
 * Three cases, in order of how much text they add: replace the numbers of an
 * `offset:` that is already there, insert one into a body that already exists,
 * or open a body for it. An element's `{` is always on its declaration line
 * (the grammar gives it no chance to be anywhere else), so the line alone
 * settles which of the last two applies.
 */
function writeOffset(source, box, dx, dy) {
  // A run's pair is `segment, delta`, not `dx, dy`: the first number names which
  // run and has to survive every re-drag, and the second is the only one a drag
  // adds to. A run slides along one axis, so the other delta is always zero.
  const run = box.what === 'segment';
  const delta = dx || dy;
  if (box.offsetSpan) {
    const current = readSpan(source, box.offsetSpan);
    const pair = run
      ? `${box.segment}, ${current.dy + delta}`
      : `${current.dx + dx}, ${current.dy + dy}`;
    return spliceSpan(source, box.offsetSpan, pair);
  }
  const lines = source.split('\n');
  const index = box.line - 1;
  const line = lines[index];
  if (line === undefined) return source;
  const indent = line.match(/^\s*/)[0];
  // A flow has no body of its own, so both of its nudges ride the inline block:
  // `label-offset` moves the label, `segment-offset` one run of the route.
  if (box.what !== 'element') {
    const statement = run
      ? `segment-offset: ${box.segment}, ${delta}`
      : `label-offset: ${dx}, ${dy}`;
    lines[index] = insertInBlock(line, statement);
    return lines.join('\n');
  }
  // A body already open at the end of the line gets the statement on its own
  // indented line, which is how the DSL is written by hand. Every other shape
  // goes inside the braces as they stand.
  if (braceIndex(line) === line.trimEnd().length - 1) {
    lines.splice(index + 1, 0, `${indent}  offset: ${dx}, ${dy}`);
    return lines.join('\n');
  }
  lines[index] = insertInBlock(line, `offset: ${dx}, ${dy}`);
  return lines.join('\n');
}

/**
 * Writes a resize into the source and returns the new text.
 *
 * Up to two statements, because a grip on the north or west face moves the
 * container's corner as well as its size: `size:` for the extent, `offset:` for
 * the corner that came with it. Both are deltas and both add to whatever is
 * already there, so a second drag continues the first.
 *
 * Replacements go in **last span first**. Two hints on one element can sit on
 * the same line, and rewriting an earlier one shifts every column after it —
 * which is exactly how a second edit lands in the middle of the first. Going
 * backwards leaves every span still to be used untouched. Insertions follow, on
 * a line no replacement has been near.
 */
function writeResize(source, box, delta) {
  const edits = [];
  // A `size:` continues from what it *became*, not from what it says. The two
  // differ wherever the floor cut the hint short, and adding to the written
  // number then writes another one the floor swallows: the box on screen would
  // sit still through several drags before the arithmetic caught up with it.
  if (delta.dw || delta.dh)
    edits.push({
      key: 'size', span: box.sizeSpan, dx: delta.dw, dy: delta.dh,
      base: box.sizeApplied && { dx: box.sizeApplied.dw, dy: box.sizeApplied.dh },
    });
  if (delta.dx || delta.dy)
    edits.push({ key: 'offset', span: box.offsetSpan, dx: delta.dx, dy: delta.dy });
  let text = source;
  const replaced = edits.filter(edit => edit.span);
  replaced.sort((a, b) => b.span.line - a.span.line || b.span.col - a.span.col);
  for (const edit of replaced) {
    const current = edit.base ?? readSpan(text, edit.span);
    text = spliceSpan(text, edit.span, `${current.dx + edit.dx}, ${current.dy + edit.dy}`);
  }
  const fresh = edits.filter(edit => !edit.span);
  if (!fresh.length) return text;
  const statement = fresh.map(edit => `${edit.key}: ${edit.dx}, ${edit.dy}`).join(' ');
  const lines = text.split('\n');
  const index = box.line - 1;
  const line = lines[index];
  if (line === undefined) return text;
  // A container's body is always open at the end of its declaration line — it
  // has children to hold — so the statement goes on its own indented line, the
  // way the DSL is written by hand. The inline shapes are still handled, for a
  // container that happens to have none.
  if (braceIndex(line) === line.trimEnd().length - 1) {
    lines.splice(index + 1, 0, `${line.match(/^\s*/)[0]}  ${statement}`);
    return lines.join('\n');
  }
  lines[index] = insertInBlock(line, statement);
  return lines.join('\n');
}

/**
 * Wraps one flow's label, by writing the `flow-label-wrap: <n>` the DSL already
 * has for it — the same contract as a drag: the source says it, the engine
 * draws it, and the file stays one an author could have typed.
 *
 * The width written is half the label. That is a *width*, not a line count:
 * `wrapText` breaks on word boundaries only, so a one-word label stays on one
 * line however narrow the half, and three long words come out on three. Two
 * even lines is the common case, not a promise — the button says "wrap", and
 * the number is there to be edited by hand afterwards.
 *
 * Wraps already on the line are replaced, not added to: the parser applies
 * entries in source order, so a stale duplicate further along the line would
 * win over the one just written. The number is derived from the label either
 * way, so re-clicking settles on the same value.
 */
function writeWrap(source, line) {
  const lines = source.split('\n');
  const text = lines[line - 1];
  if (text === undefined) return source;
  // The flow's label is the first quoted run on its line; everything quoted
  // after it belongs to an inline property.
  const label = text.match(/"((?:[^"\\]|\\.)*)"/)?.[1];
  if (!label) return source;
  const statement = `flow-label-wrap: ${Math.max(1, Math.ceil(label.length / 2))}`;
  // Masked, so a flow labelled `"flow-label-wrap: 4"` keeps its label — the
  // same care `braceIndex` takes, for the same reason. The mask is the same
  // length as the line, so its indices are the line's.
  const written = [...maskQuoted(text).matchAll(/\bflow-label-wrap\s*:\s*\d+\s*/g)];
  if (!written.length) {
    lines[line - 1] = insertInBlock(text, statement);
    return lines.join('\n');
  }
  // Back to front, so a hit still to be used keeps the index it was found at.
  // Only the first keeps a value; the rest go, spacing and all.
  let out = text;
  for (let i = written.length - 1; i >= 0; i--) {
    const hit = written[i];
    // The run of spaces the key was followed by belongs to the line, not to the
    // key — kept, or replacing the only wrap would reflow the block around it.
    const keep = i === 0 ? statement + hit[0].slice(hit[0].trimEnd().length) : '';
    out = out.slice(0, hit.index) + keep + out.slice(hit.index + hit[0].length);
  }
  lines[line - 1] = out;
  return lines.join('\n');
}

/**
 * Every `segment-offset:` and `label-offset:` taken out of `source`.
 *
 * What "re-optimise the flows" can honestly mean. A route this page drew is
 * elk's, chosen before any container was resized, and nothing downstream can
 * re-derive it — re-running the route repair over every flow was measured to
 * change nothing, because it is already at its fixpoint. What *can* be undone is
 * the hand-placing: drop the hints and the router picks the flows again, against
 * the containers as they now are.
 *
 * Element `offset:` and `size:` are left alone. Those are the dispositions the
 * author is keeping; it is the flows drawn for the *old* ones that are stale.
 *
 * Quoted text is masked first, so a flow labelled `"label-offset: 1, 2"` keeps
 * its label — the same care `braceIndex` takes, for the same reason.
 */
function stripFlowHints(source) {
  // The trailing run of spaces goes with the hint, or removing one from the
  // middle of a block leaves `{  stroke: dashed }` with a gap in it.
  const HINT = /\b(?:segment-offset|label-offset)\s*:\s*-?\d+\s*,\s*-?\d+\s*/g;
  const clean = (line) => {
    let out = '';
    let at = 0;
    for (const hit of maskQuoted(line).matchAll(HINT)) {
      out += line.slice(at, hit.index);
      at = hit.index + hit[0].length;
    }
    if (!at) return line;
    out += line.slice(at);
    // The inline block that held nothing else goes with them, rather than
    // leaving `A -> B "x" {  }` behind.
    // Anchored on the brace, not on the space before it: `maskQuoted` blanks the
    // label, so a leading `\s*` would match back across it and eat the label too.
    const empty = maskQuoted(out).search(/\{\s*\}\s*$/);
    return (empty < 0 ? out : out.slice(0, empty)).replace(/\s+$/, '');
  };
  return source.split('\n').map(clean).join('\n');
}
// #endregion drag-writeback

/**
 * Holds a drag inside the container the element lives in, so the ghost promises
 * only what the engine will actually draw — a child is never rendered outside
 * its parent, and a ghost that ignored that would land somewhere else.
 */
function holdInParent(box, dx, dy) {
  const parent = box.parent && lastBoxes.find(b => b.id === box.parent && b.what === 'element');
  if (!parent) return { dx, dy };
  const hold = (value, low, high) => Math.min(Math.max(value, low), Math.max(high, low));
  return {
    dx: hold(box.x + dx, parent.x, parent.x + parent.width - box.width) - box.x,
    dy: hold(box.y + dy, parent.y, parent.y + parent.height - box.height) - box.y,
  };
}

let dragStart = null;

/** How far this drag has travelled, in whole diagram pixels and held by nothing
    — what a resize works from, since the engine's own bounds hold it instead. */
function rawDelta(e, fromX = dragStart.clientX, fromY = dragStart.clientY) {
  return {
    dx: Math.round((e.clientX - fromX) / zoom),
    dy: Math.round((e.clientY - fromY) / zoom),
  };
}

/**
 * How far this drag has moved, in whole diagram pixels and already held inside
 * the element's container. Whole pixels because the DSL takes integers, and a
 * fractional nudge is noise the reader of the file would have to decode for
 * nothing — so the ghost and the value written to the source round identically.
 */
function dragDelta(e, box = dragStart.box, fromX = dragStart.clientX, fromY = dragStart.clientY) {
  // A terminal does not move by a delta at all: it moves to a *side*, so the
  // ghost sits on the middle of the side the drop would choose.
  if (box.what === 'terminal') {
    const target = terminalTarget(box, diagramPoint(e));
    return target ? { dx: target.x - box.x, dy: target.y - box.y } : { dx: 0, dy: 0 };
  }
  // A run slides along its normal and nowhere else — that is the one direction
  // that leaves the route orthogonal — and only as far as the engine will take
  // it, so the ghost promises what the drawing will actually show.
  if (box.what === 'segment') {
    const vertical = isVertical(box);
    const travelled = (vertical ? e.clientX - fromX : e.clientY - fromY) / zoom;
    const held = Math.round(Math.min(Math.max(travelled, box.slide.min), box.slide.max));
    return vertical ? { dx: held, dy: 0 } : { dx: 0, dy: held };
  }
  // A label has no container to be held inside — only an element does.
  if (box.what === 'label') {
    return { dx: Math.round((e.clientX - fromX) / zoom), dy: Math.round((e.clientY - fromY) / zoom) };
  }
  const held = holdInParent(box, (e.clientX - fromX) / zoom, (e.clientY - fromY) / zoom);
  return { dx: Math.round(held.dx), dy: Math.round(held.dy) };
}

/** Clears every cursor the preview can be wearing, so one place owns the list. */
const CURSOR_CLASSES = ['draggable', 'slide-x', 'slide-y', 'grab',
  ...GRIP_NAMES.map(grip => `size-${grip}`)];

// The pointer sitting on the button is still on the label as far as this page
// is concerned — recomputing the hover there would hide the button under it.
wrapIcon.addEventListener('pointerdown', e => e.stopPropagation());
wrapIcon.addEventListener('click', () => {
  const next = writeWrap(editor.value, wrapIcon.line);
  if (next === editor.value) return;
  editor.value = next;
  wrapIcon.style.display = 'none';
  flash('flow label wrapped');
  run();
});

preview.addEventListener('pointermove', e => {
  if (dragStart || panStart || e.target === wrapIcon) return;
  const point = diagramPoint(e);
  const held = grabAt(point);
  const box = held?.box ?? null;
  const run = box?.what === 'segment';
  const terminal = box?.what === 'terminal';
  preview.classList.remove(...CURSOR_CLASSES);
  if (held?.grip) preview.classList.add(`size-${held.grip}`);
  else if (terminal) preview.classList.add('grab');
  else if (run) preview.classList.add(isVertical(box) ? 'slide-x' : 'slide-y');
  else if (box) preview.classList.add('draggable');
  if (box) showOverlay(HOVER, box);
  else hideOverlay(HOVER);
  // The grips of the container in reach, whether or not the pointer is on one:
  // an affordance you only see once you are already on it is one nobody finds.
  placeGrips(held?.grip ? held.box : containerUnder(point), held?.grip);
});

preview.addEventListener('pointerleave', () => {
  hideOverlay(HOVER);
  hideGrips();
  preview.classList.remove(...CURSOR_CLASSES);
});

preview.addEventListener('pointermove', e => {
  if (!dragStart) return;
  dragStart.moved = dragStart.moved ||
    Math.abs(e.clientX - dragStart.clientX) > DRAG_THRESHOLD_PX ||
    Math.abs(e.clientY - dragStart.clientY) > DRAG_THRESHOLD_PX;
  if (!dragStart.moved) return;
  hideOverlay(HOVER);   // the ghost speaks for the drag from here
  // A resize is not a move: the ghost is the box the drop would leave, so it is
  // drawn as a rectangle of its own rather than the held box shifted.
  if (dragStart.grip) {
    const { dx, dy } = rawDelta(e);
    const rect = resized(dragStart.box, dragStart.grip, dx, dy);
    showOverlay(GHOST, rect);
    // Over the held box, not the bare rectangle: `resized` returns geometry
    // alone, and grips are only drawn for something `resizable` recognises —
    // which needs the `container` and `resize` fields the held box carries.
    placeGrips({ ...dragStart.box, ...rect }, dragStart.grip);
    return;
  }
  const { dx, dy } = dragDelta(e);
  showOverlay(GHOST, dragStart.box, dx, dy);
});

function endDrag(e) {
  if (!dragStart) return;
  const { box, grip, clientX, clientY, moved } = dragStart;
  dragStart = null;
  hideOverlay(GHOST);
  hideGrips();
  preview.releasePointerCapture(e.pointerId);
  if (!moved) return;
  // A resize writes what the *box* changed by, not what the pointer travelled:
  // the engine's bounds have already held the drag, so the two differ the moment
  // a container meets its own children.
  if (grip) {
    const { dx, dy } = rawDelta(e, clientX, clientY);
    const rect = resized(box, grip, dx, dy);
    const delta = {
      dw: rect.width - box.width,
      dh: rect.height - box.height,
      dx: rect.x - box.x,
      dy: rect.y - box.y,
    };
    if (!delta.dw && !delta.dh && !delta.dx && !delta.dy) return;
    editor.value = writeResize(editor.value, box, delta);
    const signed = value => `${value >= 0 ? '+' : ''}${value}`;
    flash(`${box.id} resized ${signed(delta.dw)}, ${signed(delta.dh)}`);
    run();
    return;
  }
  // A terminal is re-attached, not nudged: what a drop settles is which side of
  // the element the flow meets, and the layout answers for the seat on it.
  if (box.what === 'terminal') {
    const target = terminalTarget(box, diagramPoint(e));
    if (!target || target.side === box.endpoint.side) return;
    editor.value = writeSide(editor.value, box, target.side);
    const end = box.endpoint.end === 'from' ? 'start' : 'end';
    flash(`${box.id} ${end} moved to the ${target.side} of ${box.endpoint.element}`);
    run();
    return;
  }
  const { dx, dy } = dragDelta(e, box, clientX, clientY);
  if (!dx && !dy) return;
  editor.value = writeOffset(editor.value, box, dx, dy);
  const signed = value => `${value >= 0 ? '+' : ''}${value}`;
  flash(box.what === 'segment'
    ? `${box.id} run ${box.segment} slid ${signed(dx || dy)}`
    : `${box.id} nudged ${signed(dx)}, ${signed(dy)}`);
  run();
}

preview.addEventListener('pointerup', endDrag);
preview.addEventListener('pointercancel', endDrag);

// Touch is left to the browser, which already pans this scroll container —
// handling it here too would move it twice.
let panStart = null;

preview.addEventListener('pointerdown', e => {
  if (e.button !== 0 || e.pointerType === 'touch' || !svgViewBox()) return;
  e.preventDefault();   // otherwise the browser starts dragging the SVG itself
  // An element under the pointer takes the drag; empty canvas still pans, so
  // both gestures live on the same button without a mode to switch between.
  const held = grabAt(diagramPoint(e));
  if (held) {
    dragStart = { ...held, clientX: e.clientX, clientY: e.clientY, moved: false };
    preview.setPointerCapture(e.pointerId);
    return;
  }
  panStart = { x: e.clientX, y: e.clientY, left: preview.scrollLeft, top: preview.scrollTop };
  preview.setPointerCapture(e.pointerId);
  preview.classList.add('panning');
});

preview.addEventListener('pointermove', e => {
  if (!panStart) return;
  preview.scrollLeft = panStart.left - (e.clientX - panStart.x);
  preview.scrollTop = panStart.top - (e.clientY - panStart.y);
});

function endPan(e) {
  if (!panStart) return;
  panStart = null;
  preview.releasePointerCapture(e.pointerId);
  preview.classList.remove('panning');
}
preview.addEventListener('pointerup', endPan);
preview.addEventListener('pointercancel', endPan);

const ZOOM_KEYS = { '+': 'in', '=': 'in', '-': 'out', '_': 'out', '0': 'reset' };

const TYPING_TAGS = new Set(['TEXTAREA', 'INPUT', 'SELECT']);

// Modifier held means the browser's own page zoom (ctrl/⌘ +/-/0), not ours.
document.addEventListener('keydown', e => {
  if (TYPING_TAGS.has(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
  const action = ZOOM_KEYS[e.key];
  if (!action) return;
  e.preventDefault();
  ZOOM_ACTIONS[action]();
});

// --- Resizable split --------------------------------------------------------
// The editor pane's width, dragged rather than fixed at 44%. It writes the
// `--left-w` variable the stylesheet reads, so there is one source of truth and
// the default still stands for anyone who has never touched the handle.
const splitter = document.getElementById('splitter');
const mainEl = document.querySelector('main');
const DEFAULT_SPLIT = '44%';
// The preview needs room to stay a preview; the editor has its own CSS floor.
const MIN_LEFT_PX = 320, MIN_RIGHT_PX = 360;
const SPLIT_KEY = 'cairn:split';

const setSplit = value => document.documentElement.style.setProperty('--left-w', value);

// Stored as a percentage rather than pixels: a split dragged on a wide monitor
// should still leave both panes usable when the page is reopened on a laptop.
try {
  const saved = localStorage.getItem(SPLIT_KEY);
  if (saved) setSplit(saved);
} catch { /* private mode, or storage disabled — the default stands */ }

splitter.addEventListener('pointerdown', e => {
  e.preventDefault();
  splitter.setPointerCapture(e.pointerId);
  splitter.classList.add('dragging');
  document.body.classList.add('resizing');
});

splitter.addEventListener('pointermove', e => {
  if (!splitter.hasPointerCapture(e.pointerId)) return;
  const bounds = mainEl.getBoundingClientRect();
  // On a narrow window the two floors can overlap; the editor's wins, and the
  // clamp stays a clamp instead of inverting into an empty range.
  const max = Math.max(bounds.width - MIN_RIGHT_PX, MIN_LEFT_PX);
  const px = Math.min(Math.max(e.clientX - bounds.left, MIN_LEFT_PX), max);
  setSplit((px / bounds.width * 100).toFixed(2) + '%');
});

function endResize(e) {
  if (!splitter.hasPointerCapture(e.pointerId)) return;
  splitter.releasePointerCapture(e.pointerId);
  splitter.classList.remove('dragging');
  document.body.classList.remove('resizing');
  try {
    localStorage.setItem(SPLIT_KEY, document.documentElement.style.getPropertyValue('--left-w'));
  } catch { /* nothing to do: the split still holds for this session */ }
}
splitter.addEventListener('pointerup', endResize);
splitter.addEventListener('pointercancel', endResize);

// A dragged split is easy to lose track of; double-click puts it back.
splitter.addEventListener('dblclick', () => {
  setSplit(DEFAULT_SPLIT);
  try { localStorage.removeItem(SPLIT_KEY); } catch { /* see above */ }
});

// load: shared link > logical starter
const m = location.hash.match(/src=([^&]+)/);
editor.value = m ? b64decode(m[1]) : TEMPLATES.logical;
run();
</script>
</body>
