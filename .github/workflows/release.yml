# Release automation
# on tag v* -> test -> compile binaries for 5 platforms -> attest provenance
# -> GitHub Release -> then in parallel: bump brew formula & scoop manifest in
# their repos, and publish @r0kshan/cairn to npm.
#
# Security posture: actions pinned to a commit SHA (comment shows the tag),
# GITHUB_TOKEN read-only by default with each job opting into what it needs,
# checkouts don't persist credentials.
name: release
on:
  push:
    tags: ["v*"]

# Read-only by default; jobs opt into the narrow writes they need.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22, package-manager-cache: false }
      - run: npm ci
      - run: npm test

  binaries:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub Release + upload assets
      id-token: write      # OIDC token for build-provenance attestation
      attestations: write  # write the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { no-cache: true }
      - run: bun install
      # The tag is the version, not package.json — keeps binaries, checksums and
      # the taps job's checksums lookup in sync even if package.json wasn't bumped.
      - run: VERSION="${GITHUB_REF_NAME#v}" bash scripts/build-binaries.sh

      # Don't ship a binary that can't run. The second arg asserts `cairn version`
      # reports this exact tag — the point of CAIRN_BUILD_VERSION over package.json.
      - run: bash scripts/smoke-binary.sh "dist/cairn-${GITHUB_REF_NAME#v}-linux-x64" "${GITHUB_REF_NAME#v}"

      # Verify with: gh attestation verify <binary> --repo R0kshan/cairn
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/cairn-*
            !dist/*.txt

      # The binaries inline elkjs (EPL-2.0) and the Simple Icons artwork, so the
      # licence texts and the attribution table are part of what a release
      # distributes — EPL-2.0 §3.1(b), and the per-icon MIT / BSD-3-Clause /
      # CC-BY-4.0 / Apache-2.0 terms. The npm tarball ships them through
      # `files`; this is the same duty for the binary channel.
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/cairn-*
            LICENSE
            THIRD-PARTY-NOTICES.md
            licenses/elkjs-EPL-2.0.md
            licenses/simple-icons-CC0-1.0.md
          generate_release_notes: true

      # Hand the built binaries + checksums to the taps job.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  # npm channel. Gated on `binaries` though it needs nothing from it: a GitHub
  # Release deletes in one click, an npm version is immutable — so publish last
  # and the recoverable channel is the one that fails first.
  #
  # Auth is OIDC trusted publishing (configure it once on npmjs.com — see
  # RELEASING.md). No NPM_TOKEN exists in this repo and none should be added.
  publish:
    needs: binaries
    runs-on: ubuntu-latest
    # npm's trusted publisher matches on repository + workflow *filename*, so
    # naming release.yml alone would also let `binaries` publish — it holds
    # `id-token: write` for its attestations. The environment narrows the OIDC
    # claim to this job. It must exist under Settings → Environments and match
    # the npm config exactly, or publishing fails to authenticate. Add required
    # reviewers there to gate releases behind manual approval.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write      # OIDC token for trusted publishing + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22, package-manager-cache: false }

      # Node 22 ships npm 10.x; trusted publishing needs >= 11.5.1. Pinned like
      # every action here — least of all should the tool holding the publish
      # credential float.
      - run: npm install -g npm@11.5.1

      - run: npm ci

      # npm publishes package.json's `version`, not the tag, so sync it or every
      # release republishes whatever was last committed. --allow-same-version
      # makes it a no-op when package.json was already bumped.
      - run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # Don't ship a package that can't install. After the bump, so it also
      # asserts both published surfaces report this exact tag.
      - run: bash scripts/smoke-npm.sh "${GITHUB_REF_NAME#v}"

      - name: Publish to npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          # Republishing is a hard 403, so skip instead of failing the run — hit
          # by re-running a release, or by the first tag after the manual
          # bootstrap publish. `npm view` prints nothing when the version is
          # absent, so empty output is the signal.
          if [ -n "$(npm view "@r0kshan/cairn@$VERSION" version 2>/dev/null)" ]; then
            echo "$VERSION is already on the registry — skipping publish"
            exit 0
          fi

          # A prerelease must never land on `latest`.
          case "$VERSION" in
            *-*) DIST_TAG=unstable ;;
            *)   DIST_TAG=latest ;;
          esac
          echo "publishing $VERSION to dist-tag $DIST_TAG"
          npm publish --tag "$DIST_TAG"

  taps:
    needs: binaries
    runs-on: ubuntu-latest
    # Only reads this repo; pushes go to the tap/bucket repos via PUSH_TOKEN.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22, package-manager-cache: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: dist, path: dist }

      - name: Render formula + manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/render-packaging.mjs "$VERSION" "dist/cairn-${VERSION}-checksums.txt"

      # Push the rendered formula to the Homebrew tap repo (R0kshan/homebrew-tap).
      - name: Publish Homebrew formula
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git clone "https://x-access-token:${PUSH_TOKEN}@github.com/R0kshan/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp dist/cairn.rb tap/Formula/cairn.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/cairn.rb
          git commit -m "cairn ${VERSION}" || { echo "no change"; exit 0; }
          git push

      # Push the rendered manifest to the Scoop bucket repo (R0kshan/scoop-bucket).
      - name: Publish Scoop manifest
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git clone "https://x-access-token:${PUSH_TOKEN}@github.com/R0kshan/scoop-bucket.git" bucket
          mkdir -p bucket/bucket
          cp dist/cairn.json bucket/bucket/cairn.json
          cd bucket
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/cairn.json
          git commit -m "cairn ${VERSION}" || { echo "no change"; exit 0; }
          git push
