# Release automation
# on tag v* -> test -> compile binaries for 5 platforms -> attest provenance
# -> GitHub Release -> then in parallel: bump brew formula & scoop manifest in
# their repos, and publish @r0kshan/cairn to npm.
#
# Security posture:
#  - all actions are pinned to a commit SHA (comment shows the human tag),
#  - least privilege: the default GITHUB_TOKEN is read-only; only the `binaries`
#    job is granted the writes it needs,
#  - checkouts don't persist credentials.
name: release
on:
  push:
    tags: ["v*"]

# Read-only by default; jobs opt into the narrow writes they need.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22, package-manager-cache: false }
      - run: npm ci
      - run: npm test

  binaries:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub Release + upload assets
      id-token: write      # OIDC token for build-provenance attestation
      attestations: write  # write the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { no-cache: true }
      - run: bun install
      # Tag is the single source of truth for the release version — see
      # scripts/build-binaries.sh. Keeps binaries, checksums, and the
      # `taps` job's `dist/cairn-${VERSION}-checksums.txt` lookup in sync
      # even if package.json wasn't bumped before tagging.
      - run: VERSION="${GITHUB_REF_NAME#v}" bash scripts/build-binaries.sh

      # Don't ship a binary that can't run: smoke the just-built linux binary
      # (the runner can execute it) through the full pipeline before publishing.
      # The second arg makes the smoke test assert `cairn version` reports this
      # exact tag — the whole point of CAIRN_BUILD_VERSION over package.json.
      - run: bash scripts/smoke-binary.sh "dist/cairn-${GITHUB_REF_NAME#v}-linux-x64" "${GITHUB_REF_NAME#v}"

      # Cryptographic provenance: proves each binary was built by this workflow.
      # Verifiable with: gh attestation verify <binary> --repo R0kshan/cairn
      # NOTE: attest-build-provenance is pinned to its major tag below because its
      # commit SHA couldn't be resolved at authoring time. It's a first-party
      # (actions/*) action, the lowest-risk case; to fully pin it run:
      #   gh api repos/actions/attest-build-provenance/commits/v2 --jq .sha
      # and replace `@v2` with `@<sha> # v2`.
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 #v4.1.1
        with:
          subject-path: |
            dist/cairn-*
            !dist/*.txt

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/cairn-*
          generate_release_notes: true

      # Hand the built binaries + checksums to the taps job.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  # npm channel — ships the CLI (`bin`).
  #
  # Gated on `binaries` even though it needs nothing from it, because the two
  # channels fail asymmetrically: a deleted GitHub Release costs one click,
  # while an npm version is immutable after 72h and can never be reused. Running
  # them in parallel means a `binaries` failure still leaves a published version
  # pointing at a release that does not exist. Publishing last picks the
  # recoverable failure mode.
  #
  # Auth is OIDC trusted publishing: no NPM_TOKEN secret exists in this repo,
  # and none should be added. npm also attaches provenance automatically,
  # matching the attestation the binaries carry. The trusted publisher must be
  # configured once on npmjs.com before this job can authenticate — see
  # RELEASING.md.
  publish:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # OIDC token for trusted publishing + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22, package-manager-cache: false }

      # Node 22 ships npm 10.x; trusted publishing needs >= 11.5.1. Pinned to a
      # major rather than `@latest` — every action in this workflow is pinned,
      # and an unpinned global install of the tool that holds the publish
      # credential is the last place to make an exception.
      - run: npm install -g npm@^11.5.1

      - run: npm ci

      # npm publishes package.json's `version` — unlike the binaries, the tag is
      # NOT the source of truth here (build-binaries.sh gets that via
      # CAIRN_BUILD_VERSION). Without this, every release would republish
      # whatever version was last committed. --allow-same-version makes it a
      # no-op when package.json was already bumped.
      - run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # Don't ship a CLI that can't run — the npm mirror of the binaries job's
      # smoke step. Packs the tarball, installs it into a scratch consumer, and
      # drives the installed command through the full pipeline. Runs AFTER the
      # version bump so it also asserts the published CLI reports this exact tag.
      - run: bash scripts/smoke-npm.sh "${GITHUB_REF_NAME#v}"

      # A prerelease must not land on `latest`, or `npm i @r0kshan/cairn` hands
      # people a release candidate.
      - name: Publish to npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in
            *-*) DIST_TAG=unstable ;;
            *)   DIST_TAG=latest ;;
          esac
          echo "publishing $VERSION to dist-tag $DIST_TAG"
          npm publish --tag "$DIST_TAG"

  taps:
    needs: binaries
    runs-on: ubuntu-latest
    # Only reads this repo; pushes go to the tap/bucket repos via PUSH_TOKEN.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22, package-manager-cache: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: dist, path: dist }

      - name: Render formula + manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/render-packaging.mjs "$VERSION" "dist/cairn-${VERSION}-checksums.txt"

      # Push the rendered formula to the Homebrew tap repo (R0kshan/homebrew-tap).
      - name: Publish Homebrew formula
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git clone "https://x-access-token:${PUSH_TOKEN}@github.com/R0kshan/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp dist/cairn.rb tap/Formula/cairn.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/cairn.rb
          git commit -m "cairn ${VERSION}" || { echo "no change"; exit 0; }
          git push

      # Push the rendered manifest to the Scoop bucket repo (R0kshan/scoop-bucket).
      - name: Publish Scoop manifest
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git clone "https://x-access-token:${PUSH_TOKEN}@github.com/R0kshan/scoop-bucket.git" bucket
          mkdir -p bucket/bucket
          cp dist/cairn.json bucket/bucket/cairn.json
          cd bucket
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/cairn.json
          git commit -m "cairn ${VERSION}" || { echo "no change"; exit 0; }
          git push
