# Static application security testing (SAST) with CodeQL.
# Scans the TypeScript sources for injection, XSS, unsafe patterns, etc.
name: codeql
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly (Mon 06:00 UTC), catches newly-published queries

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload CodeQL results to the Security tab
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 #v4.37.3
        with:
          languages: javascript-typescript
          queries: security-extended # broader security query suite than the default
          # Exclude generated bundles. `playground/cairn-engine.js` and
          # `playground/lib/*.mjs` are build artifacts of `npm run build:playground`
          # that inline elkjs, so alerts there are (a) third-party code we cannot
          # patch, and (b) duplicates of what is already scanned in `src/`.
          config: |
            paths-ignore:
              - playground/cairn-engine.js
              - playground/lib
      - uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a #v4.37.1
