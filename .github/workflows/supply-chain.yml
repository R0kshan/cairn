# Supply-chain + workflow-hardening checks that complement CodeQL.
#  - audit:     fails if any (dev or runtime) dependency has a high+ advisory.
#  - workflows: static-analyses the GitHub Actions workflows themselves (pinning,
#               permissions, injection) with zizmor.
name: supply-chain
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly, so new advisories surface without a push

permissions:
  contents: read

jobs:
  audit-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22 }
      - run: npm ci
      - run: npm audit --audit-level=high

  audit-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - run: pipx run zizmor --min-severity high .github/workflows
